<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schaeffler DPFC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left"></div>
            <div class="header-center">
                <h1>Schaeffler DPFC</h1>
            </div>
            <div class="header-right">
                <div class="login-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="logo">
                    <img src="assets/schaeffler-logo.jpg" 
                         alt="Schaeffler Logo" 
                         class="logo-image"
                         loading="eager">
                    <div class="logo-placeholder" style="display: none;">Schaeffler</div>
                </div>
            </div>
        </header>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <nav class="sidebar-nav">
                    <ul>
                        <li>
                            <a href="#" class="nav-item active">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                                </svg>
                                <span class="nav-text">Home</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-item">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                </svg>
                                <span class="nav-text">Catalog</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-item">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                                </svg>
                                <span class="nav-text">My Processes</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-item">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                                <span class="nav-text">Feedback</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-item">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                                <span class="nav-text">Support</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div class="content-wrapper">
                    <h2 class="content-title">Welcome to Schaeffler DPFC</h2>
                    <div class="icon-grid">
                        <div class="icon-card">
                            <div class="icon-placeholder">
                                <img src="https://github.com/user-attachments/assets/7df583c8-7036-441c-ade6-37a58fc8e4c8" 
                                     alt="PFA Icon" 
                                     class="process-icon"
                                     loading="eager">
                            </div>
                            <p class="icon-caption">Product Feasibility Analysis</p>
                        </div>
                        <div class="icon-card">
                            <div class="icon-placeholder">
                                <img src="https://github.com/user-attachments/assets/9dfb02a2-0979-42fa-a0c9-692bcfaaaf37" 
                                     alt="DFM Icon" 
                                     class="process-icon"
                                     loading="eager">
                            </div>
                            <p class="icon-caption">Design For Manufacturing and Assembly</p>
                        </div>
                        <div class="icon-card">
                            <div class="icon-placeholder">
                                <img src="https://github.com/user-attachments/assets/33401459-4105-4784-bf44-5cdc215e7cb1" 
                                     alt="VSD Icon" 
                                     class="process-icon"
                                     loading="eager">
                            </div>
                            <p class="icon-caption">Value Stream Design</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
